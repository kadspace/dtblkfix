name: release

# a tag v<version> builds, tests and packages DtBlkFix and attaches the zip and installer to a
# draft release, to be checked and published by hand

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^project(DtBlkFix VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: DtBlkFix-*
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes=$(awk -v v="## $VERSION" '$0 ~ "^"v {on=1; next} /^## / {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --draft --title "DtBlkFix $VERSION" \
            --notes "$notes" dist/DtBlkFix-$VERSION-win64.zip dist/DtBlkFix-$VERSION-setup.exe
